<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login with Sidebar and Map</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .main-content {
      display: flex;
      flex: 1;
    }

    /* Sidebar styles */
    .sidebar {
      width: 250px;
      background-color: #1f2937;
      color: white;
      padding: 20px;
    }

    .sidebar h3 {
      margin-top: 0;
    }

    .dropdown {
      margin-bottom: 20px;
    }

    .dropdown label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .dropdown select {
      width: 100%;
      padding: 8px;
      border-radius: 5px;
      border: none;
    }

    /* Login form styles */
    .form-wrapper {
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .form-container {
      background: #fff;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }

    .form-container h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #2563eb;
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    .link {
      display: block;
      margin-top: 15px;
      text-align: center;
    }

    /* Map styles */
    .map-container {
      width: 100%;
      height: 300px;
      margin-top: auto;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <!-- Main layout: Sidebar and Login Form -->
  <div class="main-content">
    <div class="sidebar">
      <h3>Filter Options</h3>
      <div class="dropdown">
        <label for="clients">Clients</label>
        <select id="clients" name="clients">
          <option value="">--Select Client--</option>
          <option value="client1">Client 1</option>
          <option value="client2">Client 2</option>
          <option value="client3">Client 3</option>
        </select>
      </div>
      <div class="dropdown">
        <label for="cities">Cities</label>
        <select id="cities" name="cities">
          <option value="">--Select City--</option>
          <option value="surat">Surat</option>
          <option value="mumbai">Mumbai</option>
          <option value="delhi">Delhi</option>
        </select>
      </div>
    </div>

    <div class="form-wrapper">
      <div class="form-container">
        <h2>Login</h2>
        <form method="post">
          {% csrf_token %}
          <input type="text" name="username" placeholder="Username" required />
          <input type="password" name="password" placeholder="Password" required />
          <button type="submit">Login</button>
        </form>
        <a class="link" href="{% url 'register' %}">Don't have an account? Register</a>
      </div>
    </div>
  </div>

  <!-- Google Map of IIIT Surat -->
  <div class="map-container">
    <iframe
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3719.275329246778!2d72.7860487751606!3d21.21937988047257!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3be04d50b34e7383%3A0x346c7a1a19a7f139!2sIndian%20Institute%20of%20Information%20Technology%2C%20Surat%20(IIIT%20Surat)!5e0!3m2!1sen!2sin!4v1716260426316!5m2!1sen!2sin"
      allowfullscreen=""
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </div>

</body>
</html>
